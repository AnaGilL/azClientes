{% extends 'base.html' %}

{% block content %}
<section class="card form-card">
    <h2>{{ titulo }}</h2>

    <form method="POST" class="client-form">
        <label for="nombre">Nombre *</label>
        <input
            id="nombre"
            name="nombre"
            type="text"
            value="{{ cliente.nombre if cliente else '' }}"
            required
        />

        <label for="email">Email *</label>
        <input
            id="email"
            name="email"
            type="email"
            value="{{ cliente.email if cliente else '' }}"
            required
        />

        <label for="telefono">Telefono *</label>
        <input
            id="telefono"
            name="telefono"
            type="text"
            value="{{ cliente.telefono if cliente else '' }}"
            required
        />

        <label for="empresa">Empresa</label>
        <input
            id="empresa"
            name="empresa"
            type="text"
            value="{{ cliente.empresa if cliente else '' }}"
        />

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-light" href="{{ url_for('listar_clientes') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
